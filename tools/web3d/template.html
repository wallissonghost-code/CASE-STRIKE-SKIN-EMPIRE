<title>Case Strike 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: tela cheia 3D; HUD flutuante nas bordas; painéis em janela central com rolagem interna */
:root {
  --ink: #f4f7ff;
  --ink-dim: #a9b6d8;
  --night: #0d1430;
  --panel: #18224a;
  --panel-2: #222f63;
  --line: #3a4a8c;
  --gold: #ffcc3d;
  --gold-deep: #e08a00;
  --mint: #4ee39a;
  --red: #ff5a64;
  --sky: #59c8ff;
  --shadow: rgba(4, 8, 24, .55);
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Rubik", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
#game { position: fixed; inset: 0; }
#game canvas { display: block; width: 100%; height: 100%; }
.hud { position: fixed; pointer-events: none; z-index: 5; }
.hud > * { pointer-events: auto; }
.chunk { font-family: var(--display); letter-spacing: .02em; text-shadow: 0 2px 0 rgba(0,0,0,.45); }

/* topo */
#topbar { top: calc(env(safe-area-inset-top, 0px) + 10px); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; width: min(560px, calc(100vw - 32px)); }
#money { display: flex; align-items: center; gap: 10px; background: linear-gradient(#2a3a7a, #1a2556); border: 3px solid #0b1230; border-radius: 14px; padding: 6px 16px; box-shadow: 0 4px 0 #0b1230; }
#money .c { font-size: 26px; color: var(--gold); font-variant-numeric: tabular-nums; }
#money .r { font-size: 14px; color: var(--mint); font-variant-numeric: tabular-nums; }
#flash { font-size: 15px; padding: 5px 14px; border-radius: 999px; background: #0b1230cc; border: 2px solid var(--line); text-align: center; }
#flash.on { background: linear-gradient(90deg, #2f9e44, #6fdc4a); border-color: #c9ff9a; font-size: 18px; animation: pulse 1.2s ease-in-out infinite; }
#flash.on.xp { background: linear-gradient(90deg, #3e5bd8, #7c9bff); border-color: #cfdcff; }
#flash.on.income { background: linear-gradient(90deg, #c77c00, #ffcc3d); border-color: #fff1b8; color: #3a2400; text-shadow: none; }
@keyframes pulse { 50% { transform: scale(1.05); } }
#buffs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.buff { display: flex; align-items: center; gap: 4px; background: #0b1230cc; border: 2px solid var(--line); border-radius: 10px; padding: 2px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }

/* menu lateral */
#side { left: max(10px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); display: grid; grid-template-columns: repeat(2, 58px); gap: 7px; }
.sb { width: 58px; height: 58px; border-radius: 14px; background: linear-gradient(#3b4fa0, #24336e); border: 3px solid #0b1230; box-shadow: 0 4px 0 #0b1230; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; position: relative; }
.sb:active { transform: translateY(3px); box-shadow: 0 1px 0 #0b1230; }
.sb .i { font-size: 22px; line-height: 1; }
.sb .l { font-family: var(--display); font-size: 10px; letter-spacing: .03em; }
.sb.big { grid-column: span 2; width: auto; height: 52px; flex-direction: row; gap: 8px; background: linear-gradient(#ffd75a, #f29b00); color: #3a2000; }
.sb.big .l { font-size: 18px; }
.sb.soon { opacity: .7; }
.sb .dot { position: absolute; top: -5px; right: -5px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--red); border: 2px solid #0b1230; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 4px; }

/* luck chip + zona */
#luck { right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#luck .chip { background: #0b1230cc; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font-size: 14px; }
#luck .chip b { color: var(--mint); }

/* XP */
#xpbar { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); width: min(520px, calc(100vw - 32px)); display: flex; align-items: center; gap: 8px; }
#xpbar .lv { font-family: var(--display); font-size: 18px; background: var(--sky); color: #06213a; border: 3px solid #0b1230; border-radius: 12px; padding: 2px 10px; text-shadow: none; white-space: nowrap; }
#xpbar .track { flex: 1; height: 18px; background: #0b1230; border-radius: 9px; border: 2px solid #0b1230; overflow: hidden; position: relative; }
#xpbar .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #4ee39a, #9cff6a); width: 0; transition: width .3s; }
#xpbar .txt { position: absolute; inset: 0; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }

/* interação e zona */
#prompt { left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); transform: translateX(-50%); }
#prompt button { font-family: var(--display); font-size: 20px; padding: 10px 22px; border-radius: 14px; background: linear-gradient(#7dff9e, #22c065); color: #053a1c; border: 3px solid #0b1230; box-shadow: 0 4px 0 #0b1230; text-shadow: none; white-space: nowrap; }
#prompt kbd { background: #053a1c; color: #c8ffd9; border-radius: 6px; padding: 0 6px; margin-right: 8px; font-family: var(--body); font-size: 14px; }
#zoneBanner { left: 50%; top: 24%; transform: translateX(-50%); text-align: center; pointer-events: none; font-size: clamp(30px, 6vw, 54px); line-height: 1.05; opacity: 0; transition: opacity .5s; -webkit-text-stroke: 2px #0b1230; }
#zoneBanner small { display: block; font-size: .55em; color: var(--mint); }
#toast { left: 50%; top: calc(env(safe-area-inset-top, 0px) + 120px); transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: #0b1230ee; border: 2px solid var(--line); border-radius: 12px; padding: 8px 14px; font-weight: 600; font-size: 14px; animation: tin .25s ease-out; max-width: 90vw; text-align: center; }
.toast.bad { border-color: var(--red); }
.toast.good { border-color: var(--mint); }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }

/* mobile */
#joy { left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); width: 120px; height: 120px; border-radius: 50%; background: rgba(11,18,48,.38); border: 3px solid rgba(255,255,255,.65); display: none; touch-action: none; }
#joy .knob { position: absolute; left: 32px; top: 32px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.8); border: 3px solid #0b1230; }
#jump { right: max(22px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 50px); width: 76px; height: 76px; border-radius: 50%; background: rgba(11,18,48,.45); border: 3px solid rgba(255,255,255,.7); font-size: 26px; display: none; }
body.touch #joy, body.touch #jump { display: block; }
body.touch #side { top: calc(env(safe-area-inset-top, 0px) + 128px); transform: none; grid-template-columns: repeat(6, 44px); gap: 5px; }
body.touch .sb { width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 3px 0 #0b1230; }
body.touch .sb .i { font-size: 19px; }
body.touch .sb .l { display: none; }
body.touch .sb.big { grid-column: span 2; height: 44px; }
body.touch .sb.big .l { display: block; font-size: 15px; }
body.touch .sb.big .i { display: none; }
@media (max-height: 520px) { body.touch #side { top: calc(env(safe-area-inset-top, 0px) + 10px); grid-template-columns: repeat(3, 40px); } body.touch .sb { width: 40px; height: 40px; } body.touch .sb.big { grid-column: span 3; } }
@media (max-height: 640px) { body:not(.touch) #side { grid-template-columns: repeat(3, 52px); } body:not(.touch) .sb { width: 52px; height: 52px; } body:not(.touch) .sb.big { grid-column: span 3; } }
#help { right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); font-size: 12px; color: var(--ink-dim); background: #0b1230aa; border-radius: 10px; padding: 6px 10px; max-width: 260px; line-height: 1.4; }
body.touch #help { display: none; }

/* painel */
#overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(5, 9, 26, .55); padding-block: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 10px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.win { width: min(900px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--panel); border: 4px solid #0b1230; border-radius: 20px; box-shadow: 0 8px 0 #0b1230, 0 20px 60px var(--shadow); overflow: hidden; animation: pop .18s ease-out; }
@keyframes pop { from { transform: scale(.94); opacity: 0; } }
.win-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: linear-gradient(#3b4fa0, #2a3a80); border-bottom: 4px solid #0b1230; }
.win-h h2 { margin: 0; flex: 1; font-family: var(--display); font-weight: 400; font-size: 24px; text-shadow: 0 2px 0 rgba(0,0,0,.4); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { width: 40px; height: 40px; border-radius: 12px; background: var(--red); border: 3px solid #0b1230; font-family: var(--display); font-size: 20px; flex: none; }
.win-b { padding: 14px; overflow: auto; flex: 1; min-height: 0; touch-action: pan-y; user-select: text; -webkit-user-select: text; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tab { padding: 7px 12px; border-radius: 10px; background: var(--panel-2); border: 2px solid var(--line); font-weight: 600; font-size: 13px; }
.tab.on { background: var(--sky); color: #06213a; border-color: #0b1230; }
.btn { padding: 9px 14px; border-radius: 12px; background: linear-gradient(#5d79ff, #3a52d6); border: 3px solid #0b1230; box-shadow: 0 3px 0 #0b1230; font-family: var(--display); font-size: 15px; letter-spacing: .02em; white-space: nowrap; }
.btn.g { background: linear-gradient(#7dff9e, #22c065); color: #053a1c; }
.btn.y { background: linear-gradient(#ffd75a, #f29b00); color: #3a2000; }
.btn.r { background: linear-gradient(#ff8a8f, #e5353f); }
.btn.s { font-size: 13px; padding: 6px 10px; }
.btn:disabled { filter: grayscale(.8) brightness(.7); cursor: not-allowed; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #0b1230; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--ink-dim); font-size: 13px; }
.card { background: var(--panel-2); border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
.list { display: grid; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.bar { height: 10px; background: #0b1230; border-radius: 5px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--mint), #9cff6a); }
.tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: #0b1230; border: 1px solid var(--line); }
.num { font-variant-numeric: tabular-nums; }
h3 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 4px 0 8px; letter-spacing: .02em; }
.sec + .sec { margin-top: 16px; }

/* item */
.it { position: relative; border-radius: 12px; padding: 6px 6px 8px; background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 38%, #1a2350), #141c40 75%); border: 3px solid var(--rc); text-align: center; cursor: pointer; min-width: 0; }
.it canvas { width: 100%; height: auto; aspect-ratio: 2 / 1; display: block; }
.it .n { font-size: 11px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it .v { font-size: 12px; color: var(--gold); font-weight: 800; }
.it .rn { font-size: 10px; font-weight: 800; color: var(--rc); text-transform: uppercase; letter-spacing: .06em; }
.it .flags { position: absolute; top: 4px; left: 6px; font-size: 12px; }
.it.sel { outline: 3px solid #fff; }
.it.locked { filter: grayscale(1) brightness(.45); }
.it .new { position: absolute; top: -6px; right: -4px; background: var(--red); color: #fff; font-family: var(--display); font-size: 11px; padding: 1px 6px; border-radius: 8px; border: 2px solid #0b1230; }

/* caixas */
.cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.case { border-radius: 16px; padding: 10px; border: 3px solid #0b1230; background: linear-gradient(160deg, var(--cc), #141c40 85%); text-align: center; position: relative; min-width: 0; }
.case .box { width: 64px; height: 64px; margin: 4px auto 6px; border-radius: 12px; background: var(--cc); border: 5px solid var(--ct); box-shadow: inset 0 -10px 0 rgba(0,0,0,.25), 0 4px 0 #0b1230; }
.case .nm { font-family: var(--display); font-size: 15px; line-height: 1.1; }
.case .pr { color: var(--gold); font-weight: 800; margin: 2px 0 6px; }
.case.lock { filter: saturate(.3) brightness(.75); }
.case .badge { position: absolute; top: 6px; right: 6px; }
.odds { display: grid; gap: 5px; }
.odd { display: grid; grid-template-columns: 76px 1fr auto; gap: 8px; align-items: center; background: #141c40; border-left: 6px solid var(--rc); border-radius: 10px; padding: 4px 8px 4px 4px; }
.odd canvas { width: 76px; height: 38px; }
.odd .p { font-weight: 800; font-variant-numeric: tabular-nums; }

/* roleta */
#spin { position: fixed; inset: 0; z-index: 30; background: rgba(5, 9, 26, .82); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.reel { position: relative; width: min(860px, 100%); height: 104px; overflow: hidden; background: #0b1230; border: 3px solid var(--line); border-radius: 14px; flex: none; }
.reel.sm { height: 58px; }
.reel .strip { position: absolute; left: 0; top: 0; bottom: 0; display: flex; gap: 6px; padding: 6px 0; will-change: transform; }
.reel .cell { width: 140px; flex: none; border-radius: 10px; border-bottom: 6px solid var(--rc); background: linear-gradient(#1d2a5c, #141c40); display: flex; align-items: center; justify-content: center; }
.reel.sm .cell { width: 84px; border-bottom-width: 4px; }
.reel .cell canvas { width: 92%; height: auto; }
.reel .mark { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: var(--gold); box-shadow: 0 0 12px var(--gold); z-index: 2; }
.reels { display: flex; flex-direction: column; gap: 6px; width: min(860px, 100%); max-height: 70vh; overflow: hidden; }
#results { width: min(860px, 100%); max-height: 62vh; overflow: auto; }
.burst { animation: burst .6s ease-out; }
@keyframes burst { 0% { transform: scale(.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.hl { box-shadow: 0 0 22px var(--rc), 0 0 4px var(--rc) inset; }

/* inspeção */
#inspect { width: 100%; height: 220px; border-radius: 12px; background: radial-gradient(circle at 50% 40%, #2b3b7c, #0b1230); touch-action: none; cursor: grab; display: block; }
.confirm { background: #3a1830; border: 2px solid var(--red); border-radius: 12px; padding: 10px; }
input[type=text] { background: #0b1230; border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; color: var(--ink); font: inherit; }
.pill { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
.ok { background: #1f5f3c; color: #b6ffd2; }
.no { background: #5a2330; color: #ffc4c9; }
@media (max-width: 560px) {
  .win-h h2 { font-size: 19px; }
  .reel .cell { width: 104px; }
  .reel { height: 84px; }
  #money .c { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) {
  #flash.on, .burst, .toast, .win { animation: none; }
}
</style>

<div id="game"></div>

<div class="hud" id="topbar">
  <div id="money" class="chunk"><span class="c" id="credits">₵ 0</span><span class="r" id="rate">+0/s</span></div>
  <div id="flash" class="chunk">—</div>
  <div id="buffs"></div>
</div>
<div class="hud" id="luck"><div class="chip" id="zoneChip">Zona 1</div><div class="chip" id="luckChip">🍀 Sorte <b>+0%</b></div></div>
<div class="hud" id="side"></div>
<div class="hud" id="xpbar"><div class="lv" id="lvl">Nv 1</div><div class="track"><div class="fill" id="xpfill"></div><div class="txt" id="xptxt">0 / 100 XP</div></div></div>
<div class="hud" id="prompt" hidden><button id="promptBtn" type="button"><kbd>E</kbd><span id="promptTxt">Abrir</span></button></div>
<div class="hud chunk" id="zoneBanner"></div>
<div class="hud" id="toast"></div>
<div class="hud" id="joy"><div class="knob"></div></div>
<button class="hud" id="jump" type="button" aria-label="Pular">⤒</button>
<div class="hud" id="help"><b>WASD</b> ou setas para andar • <b>Espaço</b> pula • arraste para girar a câmera • roda do mouse aproxima • <b>E</b> interage</div>
<div id="overlay" hidden></div>
<div id="spin" hidden></div>
