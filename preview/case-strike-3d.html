<title>Case Strike 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;600;800&display=swap">
<style>
/* Layout: tela cheia 3D; HUD flutuante nas bordas; painéis em janela central com rolagem interna */
:root {
  --ink: #f4f7ff;
  --ink-dim: #a9b6d8;
  --night: #0d1430;
  --panel: #18224a;
  --panel-2: #222f63;
  --line: #3a4a8c;
  --gold: #ffcc3d;
  --gold-deep: #e08a00;
  --mint: #4ee39a;
  --red: #ff5a64;
  --sky: #59c8ff;
  --shadow: rgba(4, 8, 24, .55);
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Rubik", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--night); color: var(--ink); font-family: var(--body); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
#game { position: fixed; inset: 0; }
#game canvas { display: block; width: 100%; height: 100%; }
.hud { position: fixed; pointer-events: none; z-index: 5; }
.hud > * { pointer-events: auto; }
.chunk { font-family: var(--display); letter-spacing: .02em; text-shadow: 0 2px 0 rgba(0,0,0,.45); }

/* topo */
#topbar { top: calc(env(safe-area-inset-top, 0px) + 10px); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; width: min(560px, calc(100vw - 32px)); }
#money { display: flex; align-items: center; gap: 10px; background: linear-gradient(#2a3a7a, #1a2556); border: 3px solid #0b1230; border-radius: 14px; padding: 6px 16px; box-shadow: 0 4px 0 #0b1230; }
#money .c { font-size: 26px; color: var(--gold); font-variant-numeric: tabular-nums; }
#money .r { font-size: 14px; color: var(--mint); font-variant-numeric: tabular-nums; }
#flash { font-size: 15px; padding: 5px 14px; border-radius: 999px; background: #0b1230cc; border: 2px solid var(--line); text-align: center; }
#flash.on { background: linear-gradient(90deg, #2f9e44, #6fdc4a); border-color: #c9ff9a; font-size: 18px; animation: pulse 1.2s ease-in-out infinite; }
#flash.on.xp { background: linear-gradient(90deg, #3e5bd8, #7c9bff); border-color: #cfdcff; }
#flash.on.income { background: linear-gradient(90deg, #c77c00, #ffcc3d); border-color: #fff1b8; color: #3a2400; text-shadow: none; }
@keyframes pulse { 50% { transform: scale(1.05); } }
#buffs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.buff { display: flex; align-items: center; gap: 4px; background: #0b1230cc; border: 2px solid var(--line); border-radius: 10px; padding: 2px 8px; font-size: 13px; font-variant-numeric: tabular-nums; }

/* menu lateral */
#side { left: max(10px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%); display: grid; grid-template-columns: repeat(2, 58px); gap: 7px; }
.sb { width: 58px; height: 58px; border-radius: 14px; background: linear-gradient(#3b4fa0, #24336e); border: 3px solid #0b1230; box-shadow: 0 4px 0 #0b1230; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; position: relative; }
.sb:active { transform: translateY(3px); box-shadow: 0 1px 0 #0b1230; }
.sb .i { font-size: 22px; line-height: 1; }
.sb .l { font-family: var(--display); font-size: 10px; letter-spacing: .03em; }
.sb.big { grid-column: span 2; width: auto; height: 52px; flex-direction: row; gap: 8px; background: linear-gradient(#ffd75a, #f29b00); color: #3a2000; }
.sb.big .l { font-size: 18px; }
.sb.soon { opacity: .7; }
.sb .dot { position: absolute; top: -5px; right: -5px; min-width: 20px; height: 20px; border-radius: 10px; background: var(--red); border: 2px solid #0b1230; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 4px; }

/* luck chip + zona */
#luck { right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 12px); display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
#luck .chip { background: #0b1230cc; border: 2px solid var(--line); border-radius: 12px; padding: 4px 10px; font-size: 14px; }
#luck .chip b { color: var(--mint); }

/* XP */
#xpbar { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); width: min(520px, calc(100vw - 32px)); display: flex; align-items: center; gap: 8px; }
#xpbar .lv { font-family: var(--display); font-size: 18px; background: var(--sky); color: #06213a; border: 3px solid #0b1230; border-radius: 12px; padding: 2px 10px; text-shadow: none; white-space: nowrap; }
#xpbar .track { flex: 1; height: 18px; background: #0b1230; border-radius: 9px; border: 2px solid #0b1230; overflow: hidden; position: relative; }
#xpbar .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #4ee39a, #9cff6a); width: 0; transition: width .3s; }
#xpbar .txt { position: absolute; inset: 0; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }

/* interação e zona */
#prompt { left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); transform: translateX(-50%); }
#prompt button { font-family: var(--display); font-size: 20px; padding: 10px 22px; border-radius: 14px; background: linear-gradient(#7dff9e, #22c065); color: #053a1c; border: 3px solid #0b1230; box-shadow: 0 4px 0 #0b1230; text-shadow: none; white-space: nowrap; }
#prompt kbd { background: #053a1c; color: #c8ffd9; border-radius: 6px; padding: 0 6px; margin-right: 8px; font-family: var(--body); font-size: 14px; }
#zoneBanner { left: 50%; top: 24%; transform: translateX(-50%); text-align: center; pointer-events: none; font-size: clamp(30px, 6vw, 54px); line-height: 1.05; opacity: 0; transition: opacity .5s; -webkit-text-stroke: 2px #0b1230; }
#zoneBanner small { display: block; font-size: .55em; color: var(--mint); }
#toast { left: 50%; top: calc(env(safe-area-inset-top, 0px) + 120px); transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: #0b1230ee; border: 2px solid var(--line); border-radius: 12px; padding: 8px 14px; font-weight: 600; font-size: 14px; animation: tin .25s ease-out; max-width: 90vw; text-align: center; }
.toast.bad { border-color: var(--red); }
.toast.good { border-color: var(--mint); }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }

/* mobile */
#joy { left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 40px); width: 120px; height: 120px; border-radius: 50%; background: rgba(11,18,48,.38); border: 3px solid rgba(255,255,255,.65); display: none; touch-action: none; }
#joy .knob { position: absolute; left: 32px; top: 32px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.8); border: 3px solid #0b1230; }
#jump { right: max(22px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 50px); width: 76px; height: 76px; border-radius: 50%; background: rgba(11,18,48,.45); border: 3px solid rgba(255,255,255,.7); font-size: 26px; display: none; }
body.touch #joy, body.touch #jump { display: block; }
body.touch #side { top: calc(env(safe-area-inset-top, 0px) + 128px); transform: none; grid-template-columns: repeat(6, 44px); gap: 5px; }
body.touch .sb { width: 44px; height: 44px; border-radius: 12px; box-shadow: 0 3px 0 #0b1230; }
body.touch .sb .i { font-size: 19px; }
body.touch .sb .l { display: none; }
body.touch .sb.big { grid-column: span 2; height: 44px; }
body.touch .sb.big .l { display: block; font-size: 15px; }
body.touch .sb.big .i { display: none; }
@media (max-height: 520px) { body.touch #side { top: calc(env(safe-area-inset-top, 0px) + 10px); grid-template-columns: repeat(3, 40px); } body.touch .sb { width: 40px; height: 40px; } body.touch .sb.big { grid-column: span 3; } }
@media (max-height: 640px) { body:not(.touch) #side { grid-template-columns: repeat(3, 52px); } body:not(.touch) .sb { width: 52px; height: 52px; } body:not(.touch) .sb.big { grid-column: span 3; } }
#help { right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); font-size: 12px; color: var(--ink-dim); background: #0b1230aa; border-radius: 10px; padding: 6px 10px; max-width: 260px; line-height: 1.4; }
body.touch #help { display: none; }

/* painel */
#overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(5, 9, 26, .55); padding-block: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 10px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.win { width: min(900px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--panel); border: 4px solid #0b1230; border-radius: 20px; box-shadow: 0 8px 0 #0b1230, 0 20px 60px var(--shadow); overflow: hidden; animation: pop .18s ease-out; }
@keyframes pop { from { transform: scale(.94); opacity: 0; } }
.win-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: linear-gradient(#3b4fa0, #2a3a80); border-bottom: 4px solid #0b1230; }
.win-h h2 { margin: 0; flex: 1; font-family: var(--display); font-weight: 400; font-size: 24px; text-shadow: 0 2px 0 rgba(0,0,0,.4); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { width: 40px; height: 40px; border-radius: 12px; background: var(--red); border: 3px solid #0b1230; font-family: var(--display); font-size: 20px; flex: none; }
.win-b { padding: 14px; overflow: auto; flex: 1; min-height: 0; touch-action: pan-y; user-select: text; -webkit-user-select: text; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tab { padding: 7px 12px; border-radius: 10px; background: var(--panel-2); border: 2px solid var(--line); font-weight: 600; font-size: 13px; }
.tab.on { background: var(--sky); color: #06213a; border-color: #0b1230; }
.btn { padding: 9px 14px; border-radius: 12px; background: linear-gradient(#5d79ff, #3a52d6); border: 3px solid #0b1230; box-shadow: 0 3px 0 #0b1230; font-family: var(--display); font-size: 15px; letter-spacing: .02em; white-space: nowrap; }
.btn.g { background: linear-gradient(#7dff9e, #22c065); color: #053a1c; }
.btn.y { background: linear-gradient(#ffd75a, #f29b00); color: #3a2000; }
.btn.r { background: linear-gradient(#ff8a8f, #e5353f); }
.btn.s { font-size: 13px; padding: 6px 10px; }
.btn:disabled { filter: grayscale(.8) brightness(.7); cursor: not-allowed; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #0b1230; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--ink-dim); font-size: 13px; }
.card { background: var(--panel-2); border: 2px solid var(--line); border-radius: 14px; padding: 10px; }
.list { display: grid; gap: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.bar { height: 10px; background: #0b1230; border-radius: 5px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--mint), #9cff6a); }
.tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: #0b1230; border: 1px solid var(--line); }
.num { font-variant-numeric: tabular-nums; }
h3 { font-family: var(--display); font-weight: 400; font-size: 18px; margin: 4px 0 8px; letter-spacing: .02em; }
.sec + .sec { margin-top: 16px; }

/* item */
.it { position: relative; border-radius: 12px; padding: 6px 6px 8px; background: linear-gradient(180deg, color-mix(in srgb, var(--rc) 38%, #1a2350), #141c40 75%); border: 3px solid var(--rc); text-align: center; cursor: pointer; min-width: 0; }
.it canvas { width: 100%; height: auto; aspect-ratio: 2 / 1; display: block; }
.it .n { font-size: 11px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.it .v { font-size: 12px; color: var(--gold); font-weight: 800; }
.it .rn { font-size: 10px; font-weight: 800; color: var(--rc); text-transform: uppercase; letter-spacing: .06em; }
.it .flags { position: absolute; top: 4px; left: 6px; font-size: 12px; }
.it.sel { outline: 3px solid #fff; }
.it.locked { filter: grayscale(1) brightness(.45); }
.it .new { position: absolute; top: -6px; right: -4px; background: var(--red); color: #fff; font-family: var(--display); font-size: 11px; padding: 1px 6px; border-radius: 8px; border: 2px solid #0b1230; }

/* caixas */
.cases { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.case { border-radius: 16px; padding: 10px; border: 3px solid #0b1230; background: linear-gradient(160deg, var(--cc), #141c40 85%); text-align: center; position: relative; min-width: 0; }
.case .box { width: 64px; height: 64px; margin: 4px auto 6px; border-radius: 12px; background: var(--cc); border: 5px solid var(--ct); box-shadow: inset 0 -10px 0 rgba(0,0,0,.25), 0 4px 0 #0b1230; }
.case .nm { font-family: var(--display); font-size: 15px; line-height: 1.1; }
.case .pr { color: var(--gold); font-weight: 800; margin: 2px 0 6px; }
.case.lock { filter: saturate(.3) brightness(.75); }
.case .badge { position: absolute; top: 6px; right: 6px; }
.odds { display: grid; gap: 5px; }
.odd { display: grid; grid-template-columns: 76px 1fr auto; gap: 8px; align-items: center; background: #141c40; border-left: 6px solid var(--rc); border-radius: 10px; padding: 4px 8px 4px 4px; }
.odd canvas { width: 76px; height: 38px; }
.odd .p { font-weight: 800; font-variant-numeric: tabular-nums; }

/* roleta */
#spin { position: fixed; inset: 0; z-index: 30; background: rgba(5, 9, 26, .82); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.reel { position: relative; width: min(860px, 100%); height: 104px; overflow: hidden; background: #0b1230; border: 3px solid var(--line); border-radius: 14px; flex: none; }
.reel.sm { height: 58px; }
.reel .strip { position: absolute; left: 0; top: 0; bottom: 0; display: flex; gap: 6px; padding: 6px 0; will-change: transform; }
.reel .cell { width: 140px; flex: none; border-radius: 10px; border-bottom: 6px solid var(--rc); background: linear-gradient(#1d2a5c, #141c40); display: flex; align-items: center; justify-content: center; }
.reel.sm .cell { width: 84px; border-bottom-width: 4px; }
.reel .cell canvas { width: 92%; height: auto; }
.reel .mark { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; margin-left: -2px; background: var(--gold); box-shadow: 0 0 12px var(--gold); z-index: 2; }
.reels { display: flex; flex-direction: column; gap: 6px; width: min(860px, 100%); max-height: 70vh; overflow: hidden; }
#results { width: min(860px, 100%); max-height: 62vh; overflow: auto; }
.burst { animation: burst .6s ease-out; }
@keyframes burst { 0% { transform: scale(.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
.hl { box-shadow: 0 0 22px var(--rc), 0 0 4px var(--rc) inset; }

/* inspeção */
#inspect { width: 100%; height: 220px; border-radius: 12px; background: radial-gradient(circle at 50% 40%, #2b3b7c, #0b1230); touch-action: none; cursor: grab; display: block; }
.confirm { background: #3a1830; border: 2px solid var(--red); border-radius: 12px; padding: 10px; }
input[type=text] { background: #0b1230; border: 2px solid var(--line); border-radius: 10px; padding: 8px 10px; color: var(--ink); font: inherit; }
.pill { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; }
.ok { background: #1f5f3c; color: #b6ffd2; }
.no { background: #5a2330; color: #ffc4c9; }
@media (max-width: 560px) {
  .win-h h2 { font-size: 19px; }
  .reel .cell { width: 104px; }
  .reel { height: 84px; }
  #money .c { font-size: 21px; }
}
@media (prefers-reduced-motion: reduce) {
  #flash.on, .burst, .toast, .win { animation: none; }
}
</style>

<div id="game"></div>

<div class="hud" id="topbar">
  <div id="money" class="chunk"><span class="c" id="credits">₵ 0</span><span class="r" id="rate">+0/s</span></div>
  <div id="flash" class="chunk">—</div>
  <div id="buffs"></div>
</div>
<div class="hud" id="luck"><div class="chip" id="zoneChip">Zona 1</div><div class="chip" id="luckChip">🍀 Sorte <b>+0%</b></div></div>
<div class="hud" id="side"></div>
<div class="hud" id="xpbar"><div class="lv" id="lvl">Nv 1</div><div class="track"><div class="fill" id="xpfill"></div><div class="txt" id="xptxt">0 / 100 XP</div></div></div>
<div class="hud" id="prompt" hidden><button id="promptBtn" type="button"><kbd>E</kbd><span id="promptTxt">Abrir</span></button></div>
<div class="hud chunk" id="zoneBanner"></div>
<div class="hud" id="toast"></div>
<div class="hud" id="joy"><div class="knob"></div></div>
<button class="hud" id="jump" type="button" aria-label="Pular">⤒</button>
<div class="hud" id="help"><b>WASD</b> ou setas para andar • <b>Espaço</b> pula • arraste para girar a câmera • roda do mouse aproxima • <b>E</b> interage</div>
<div id="overlay" hidden></div>
<div id="spin" hidden></div>

function activeLuck(t, zoneId) {
  const list = [];
  const rb = Math.min(S.rebirths * RB.LuckPerRebirth, RB.LuckMax);
  if (rb > 0) list.push({ name: "Legado do renascimento", luck: rb });
  const al = attrLevel("luck") * ATTR.luck.perLevel;
  if (al > 0) list.push({ name: `Atributo Sorte (nível ${attrLevel("luck")})`, luck: al });
  const ev = activeEvent(t);
  if (ev && ev.luckModifier) list.push({ name: "Festival: " + ev.name, luck: 0.03 });
  const z = zoneId && ZONE[zoneId];
  if (z && z.luck > 0 && S.zones[zoneId]) list.push({ name: z.name, luck: z.luck });
  if ((S.activePotions.luck || 0) > t) list.push({ name: POT.luck.displayName, luck: POT.luck.luck });
  let total = list.reduce((a, e) => a + e.luck, 0);
  const fl = flashAt(t);
  if (fl && fl.kind === "luck") {
    list.push({ name: `${fl.name} (×${fl.multiplier})`, luck: total * (fl.multiplier - 1) });
    total *= fl.multiplier;
  }
  return { total: Math.min(total, DATA.luck.max), raw: total, list };
}
function computeTable(c, luck) {
  luck = Math.max(0, Math.min(luck || 0, DATA.luck.max));
  let total = 0;
  const e = c.drops.map((d) => {
    const w = d.weight * (1 + luck * (DATA.luck.tierScale[String(tierOf(d.rarity))] || 0));
    total += w;
    return { skinId: d.skinId, rarity: d.rarity, weight: w, p: 0 };
  });
  e.forEach((x) => (x.p = x.weight / total));
  return e;
}
function pickEntry(entries, r) {
  let acc = 0;
  for (const e of entries) { acc += e.p; if (r < acc) return e; }
  return entries[entries.length - 1];
}
// percentuais que somam exatamente 100 (maior resto), em centésimos de ponto
function displayPercents(entries, dec) {
  const unit = Math.pow(10, dec), total = Math.round(100 * unit);
  let used = 0;
  const fl = [], rem = [];
  entries.forEach((e, i) => { const ex = e.p * 100 * unit; fl[i] = Math.floor(ex); rem.push({ i, r: ex - fl[i] }); used += fl[i]; });
  rem.sort((a, b) => (a.r === b.r ? a.i - b.i : b.r - a.r));
  for (let k = 0; k < total - used; k++) fl[rem[k % rem.length].i]++;
  return fl.map((f) => f / unit);
}
function rng() {
  if (window.crypto && crypto.getRandomValues) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] / 4294967296; }
  return Math.random();
}

// ---------------------------------------------------------------- banco
const bankUp = (id) => S.bank.upgrades[id] || 0;
const upgradeCost = (id, l) => Math.floor(BANKUP[id].baseCost * Math.pow(BANKUP[id].growth, l) + 0.5);
const bankSlots = () => BCFG.BaseSlots + bankUp("slots") * BANKUP.slots.perLevel + Math.floor(S.rebirths / RB.ExtraBankSlotEvery);
const offlineCap = () => BCFG.MaxOfflineSeconds + bankUp("offline") * BANKUP.offline.perLevel;
const storageCap = () => Math.floor(BCFG.BaseStorage * Math.pow(1 + BANKUP.storage.perLevel, bankUp("storage")) + 0.5);
const efficiency = () => 1 + bankUp("efficiency") * BANKUP.efficiency.perLevel + Math.min(S.rebirths * RB.BankEfficiencyPerRebirth, RB.BankEfficiencyMax);
function baseIncome(def) {
  const inc = BCFG.K * Math.pow(def.value, BCFG.Exponent) * RAR[def.rarity].bankMultiplier;
  return Math.max(BCFG.MinIncomePerSkin, Math.min(inc, BCFG.MaxIncomePerSkin));
}
const itemIncome = (it) => baseIncome(SKIN[it.defId]) * efficiency();
const bankItems = () => Object.values(S.inv).filter((i) => i.loc === "bank").sort((a, b) => (a.depAt || 0) - (b.depAt || 0));
const totalRate = () => bankItems().reduce((a, i) => a + itemIncome(i), 0);
function overlap(a1, a2, b1, b2) { return Math.max(0, Math.min(a2, b2) - Math.max(a1, b1)); }
function boostedSeconds(from, to) {
  let secs = to - from;
  if (secs <= 0) return 0;
  const pe = S.activePotions.income || 0;
  if (pe > from) secs += overlap(from, to, from, pe) * (POT.income.incomeMultiplier - 1);
  flashWindows(from, to, "income").forEach((w) => (secs += overlap(from, to, w.startsAt, w.endsAt) * (w.multiplier - 1)));
  return secs;
}
function currentBoost(t) {
  let m = 1;
  if ((S.activePotions.income || 0) > t) m += POT.income.incomeMultiplier - 1;
  const fl = flashAt(t);
  if (fl && fl.kind === "income") m += fl.multiplier - 1;
  return m;
}
function settle(t) {
  const b = S.bank;
  let dt = t - (b.lastTick || t);
  if (dt < 0) dt = 0;
  dt = Math.min(dt, offlineCap());
  const cap = storageCap();
  const before = b.pending || 0;
  let produced = 0;
  if (before < cap) {
    produced = totalRate() * boostedSeconds(t - dt, t);
    b.pending = Math.min(cap, before + produced);
    produced = b.pending - before;
  }
  b.lastTick = t;
  return produced;
}

function openCases(caseId, qty, useFreeWanted, zoneId) {
  const t = now();
  const c = CASE[caseId];
  if (!c || !c.available) return fail("invalid_case");
  if (ECO.Opening && [1, 5, 10, 25].indexOf(qty) < 0) return fail("invalid_quantity");
  if (S.level < c.requiredLevel) return fail("level_locked");
  if (qty > maxQuantity()) return fail("quantity_locked");
  if (itemCount() + qty > ECO.InventoryCapacity) return fail("inventory_full");
  const free = S.freeCases[caseId] || 0;
  const useFree = useFreeWanted && free >= qty;
  const cost = useFree ? 0 : c.price * qty;
  if (S.credits < cost) return fail("insufficient_credits");
  if (c.stockPerDay && stockLeft(c, t) < qty) return fail("out_of_stock");
  refreshPeriods(t);
  const luck = activeLuck(t, zoneId).total;
  const entries = computeTable(c, luck);
  const draws = [];
  for (let i = 0; i < qty; i++) draws.push(pickEntry(entries, rng()));
  if (useFree) { if (free - qty > 0) S.freeCases[caseId] = free - qty; else delete S.freeCases[caseId]; }
  else { S.credits -= cost; S.stats.creditsSpentOnCases += cost; }
  if (c.stockPerDay) S.stock.used[caseId] = (S.stock.used[caseId] || 0) + qty;
  const results = [];
  draws.forEach((d) => {
    const def = SKIN[d.skinId];
    const it = newItem(def.id, t, caseId);
    const isNew = !S.discovered[def.id];
    const payload = { rarity: def.rarity, tier: tierOf(def.rarity), collection: def.collection, caseId };
    if (isNew) {
      S.discovered[def.id] = t;
      giveXp(RAR[def.rarity].discoverXp, null, t);
      emit("discover", payload, 1);
      const ev = activeEvent(t);
      if (ev && ev.featuredCollection === def.collection) emit("discoverFeatured", payload, 1);
      if (collectionStatus(def.collection).complete) emit("collectionComplete", payload, 1);
    }
    emit("obtain", payload, 1);
    if (def.value > S.stats.bestDropValue) S.stats.bestDropValue = def.value;
    results.push({ uid: it.uid, defId: def.id, isNew });
  });
  S.stats.casesOpened += qty;
  giveXp(ECO.Opening.XpPerOpen * qty, "open", t);
  emit("open", { caseId }, qty);
  markDirty();
  return { ok: true, results, cost, luck, entries, useFree };
}

    const total = lines.reduce((a, l) => a + l.size * 1.12, 0);

function patternTexture(v) {

function buildWeapon(skin, up) {

    box(0.7, 0.22, 0.2, sec, -1.3, 0.25, 0, g);

    blade.position.set(0, 0, -0.04); blade.castShadow = true; g.add(blade);

function caseTexture(c) {

function caseLabelTex(c) {

  else if (S.freeCases[c.id]) lines.push({ t: `${S.freeCases[c.id]} grátis`, size: 32, color: "#9ff0c4" });

function buildCases() {

  });
}
function refreshCaseLabels() {

}

// zonas: chão temático, decoração, barreiras e placa no portão
function buildZones() {

    });

    const fl = new THREE.Mesh(new THREE.PlaneGeometry(sx, sz), mat(0xffffff, { map: tex }));
    fl.rotation.x = -Math.PI / 2; fl.position.set(cx, 0.03, cz); fl.receiveShadow = true; W.scene.add(fl);
    // decoração temática

        const fh = new THREE.Mesh(new THREE.SphereGeometry(0.9, 10, 8), mat(fcol)); fh.position.y = 2.3; fh.castShadow = true; m.add(fh);
        m.scale.setScalar(1 + rnd());

        else { box(0.8, 7, 0.8, mat(0x3b2a2a), 0, 3.5, 0, m); const br = box(4, 0.5, 0.5, mat(0x3b2a2a), 1, 5.5, 0, m); br.rotation.z = 0.5; }

function zoneAt(x, z) {

function buildDecor() {
  const rnd = mulberry(7);
  const trunk = mat(0x7a4a24), leaf = mat(0x3f9a3a), leaf2 = mat(0x2f8a4a);
  let placed = 0;
  for (let i = 0; i < 400 && placed < 70; i++) {
    const x = (rnd() - 0.5) * 600, z = (rnd() - 0.5) * 600;

    if (zoneAt(x, z) !== "zone1") continue;
    if (Math.abs(x) < 14 || Math.abs(z) < 14) continue;
    if (BUILDINGS.some((b) => Math.hypot(b.x - x, b.z - z) < 26)) continue;
    let near = false;
    for (const zn of DATA.zones) if (zn.area && Math.abs(x - zn.area.center[0]) < zn.area.size[0] / 2 + 12 && Math.abs(z - zn.area.center[1]) < zn.area.size[1] / 2 + 12) near = true;

    const c1 = new THREE.Mesh(new THREE.ConeGeometry(4, 7, 8), placed % 2 ? leaf : leaf2); c1.position.y = 7; c1.castShadow = true; t.add(c1);
    const c2 = new THREE.Mesh(new THREE.ConeGeometry(3, 5, 8), placed % 2 ? leaf : leaf2); c2.position.y = 10; c2.castShadow = true; t.add(c2);
    t.scale.setScalar(0.8 + rnd() * 0.6);
    W.scene.add(t); W.colliders.push({ x, z, r: 1.6 }); placed++;
  }
  // postes de luz na praça
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 + Math.PI / 8, x = Math.sin(a) * 60, z = Math.cos(a) * 60;
    const p = new THREE.Group(); p.position.set(x, 0, z);
    box(0.5, 8, 0.5, mat(0x2b2f3a), 0, 4, 0, p);
    const l = new THREE.Mesh(new THREE.SphereGeometry(0.9, 12, 10), mat(0xfff2c0, { emissive: 0xffd27a, emissiveIntensity: 0.9 })); l.position.y = 8.4; p.add(l);
    W.scene.add(p); W.colliders.push({ x, z, r: 0.8 });
  }

  const fm = mat(0xf0e6d0);
  [[0, -312, 624, 1], [0, 312, 624, 1], [-312, 0, 1, 624], [312, 0, 1, 624]].forEach((f) => box(f[2], 3, f[3], fm, f[0], 1.5, f[1], W.scene));
}

// ---------------------------------------------------------------- controles
function setupControls() {
  const el = W.renderer.domElement;
  window.addEventListener("keydown", (e) => {
    if (e.target && (e.target.tagName === "INPUT")) return;
    if (UI.isOpen()) { if (e.key === "Escape") UI.close(); return; }
    W.keys[e.code] = true;
    if (e.code === "KeyE" && W.near) { W.near.act(); e.preventDefault(); }
    if (e.code === "Space") e.preventDefault();
  });
  window.addEventListener("keyup", (e) => { W.keys[e.code] = false; });
  window.addEventListener("blur", () => { W.keys = {}; });
  let drag = null;
  el.addEventListener("pointerdown", (e) => { drag = { id: e.pointerId, x: e.clientX, y: e.clientY }; el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove", (e) => {
    if (!drag || drag.id !== e.pointerId) return;
    W.camYaw -= (e.clientX - drag.x) * 0.006;
    W.camPitch = Math.max(0.05, Math.min(1.25, W.camPitch + (e.clientY - drag.y) * 0.005));
    drag.x = e.clientX; drag.y = e.clientY;
  });
  const end = (e) => { if (drag && drag.id === e.pointerId) drag = null; };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  el.addEventListener("wheel", (e) => { W.camDist = Math.max(8, Math.min(60, W.camDist + e.deltaY * 0.03)); e.preventDefault(); }, { passive: false });

  // joystick de toque
  const joy = document.getElementById("joy"), knob = joy.querySelector(".knob");
  let jid = null;
  const jmove = (e) => {
    const r = joy.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const m = Math.hypot(dx, dy), max = r.width / 2 - 10;
    if (m > max) { dx = (dx / m) * max; dy = (dy / m) * max; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    W.joy.x = dx / max; W.joy.y = dy / max;
  };
  joy.addEventListener("pointerdown", (e) => { jid = e.pointerId; joy.setPointerCapture(jid); W.joy.active = true; jmove(e); });
  joy.addEventListener("pointermove", (e) => { if (e.pointerId === jid) jmove(e); });
  const jend = (e) => { if (e.pointerId !== jid) return; jid = null; W.joy = { x: 0, y: 0, active: false }; knob.style.transform = ""; };
  joy.addEventListener("pointerup", jend); joy.addEventListener("pointercancel", jend);
  document.getElementById("jump").addEventListener("pointerdown", (e) => { W.keys.Space = true; setTimeout(() => (W.keys.Space = false), 120); e.preventDefault(); });
  window.addEventListener("touchstart", () => document.body.classList.add("touch"), { once: true, passive: true });
  if (matchMedia("(pointer: coarse)").matches) document.body.classList.add("touch");
}

// ---------------------------------------------------------------- simulação por quadro
function stepPlayer(dt) {
  let ix = 0, iz = 0;
  if (!UI.isOpen()) {
    const k = W.keys;
    if (k.KeyW || k.ArrowUp) iz -= 1;
    if (k.KeyS || k.ArrowDown) iz += 1;
    if (k.KeyA || k.ArrowLeft) ix -= 1;
    if (k.KeyD || k.ArrowRight) ix += 1;
    if (W.joy.active) { ix += W.joy.x; iz += W.joy.y; }
  }
  const mag = Math.min(1, Math.hypot(ix, iz));
  const run = W.keys.ShiftLeft || W.keys.ShiftRight ? 1.45 : 1;
  const speed = 24 * run;
  let mx = 0, mz = 0;
  if (mag > 0.05) {
    // direção relativa à câmera
    const a = Math.atan2(ix, iz) + W.camYaw;
    mx = Math.sin(a) * mag * speed; mz = Math.cos(a) * mag * speed;
    const target = Math.atan2(mx, mz);
    let d = target - W.yaw; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2;
    W.yaw += d * Math.min(1, dt * 12);
    W.walkT += dt * 9 * mag * run;
  } else W.walkT *= 0.85;
  if (W.keys.Space && W.onGround && !UI.isOpen()) { W.vel.y = 26; W.onGround = false; }
  W.vel.y -= 70 * dt;
  const p = W.pos;
  p.x += mx * dt; p.z += mz * dt; p.y += W.vel.y * dt;
  if (p.y <= 0) { p.y = 0; W.vel.y = 0; W.onGround = true; }
  // colisões circulares
  const R = 1.3;
  for (const c of W.colliders) {
    const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), m = c.r + R;
    if (d < m && d > 0.0001) { p.x = c.x + (dx / d) * m; p.z = c.z + (dz / d) * m; }
  }
  // barreiras das zonas bloqueadas
  for (const id in W.zoneBarriers) {
    if (S.zones[id]) continue;
    const [x1, z1, x2, z2] = W.zoneBarriers[id].rect;
    if (p.x > x1 - R && p.x < x2 + R && p.z > z1 - R && p.z < z2 + R) {
      const pen = [p.x - (x1 - R), x2 + R - p.x, p.z - (z1 - R), z2 + R - p.z];
      const i = pen.indexOf(Math.min.apply(null, pen));
      if (i === 0) p.x = x1 - R; else if (i === 1) p.x = x2 + R; else if (i === 2) p.z = z1 - R; else p.z = z2 + R;
      if (!W.lastBlockToast || performance.now() - W.lastBlockToast > 2500) { W.lastBlockToast = performance.now(); toast(`${ZONE[id].name.split(" — ")[0]} bloqueada. Desbloqueie na placa ou no painel Zonas.`, "bad"); }
    }
  }
  p.x = Math.max(-308, Math.min(308, p.x)); p.z = Math.max(-308, Math.min(308, p.z));
  const pl = W.player;
  pl.position.copy(p); pl.rotation.y = W.yaw;
  const sw = Math.sin(W.walkT) * 0.7 * Math.min(1, mag + 0.001);
  W.legL.rotation.x = sw; W.legR.rotation.x = -sw;
  W.armL.rotation.x = -sw; W.armR.rotation.x = W.held ? -0.9 : sw;
  if (!W.onGround) { W.legL.rotation.x = 0.4; W.legR.rotation.x = -0.2; }
  W.blob.position.set(p.x, 0.05, p.z);
  // câmera
  const cam = W.camera, d = W.camDist;
  const tx = p.x, ty = p.y + 4.5, tz = p.z;
  cam.position.set(tx + Math.sin(W.camYaw) * Math.cos(W.camPitch) * d, ty + Math.sin(W.camPitch) * d, tz + Math.cos(W.camYaw) * Math.cos(W.camPitch) * d);
  cam.lookAt(tx, ty, tz);
  W.sun.position.set(p.x + 60, 120, p.z + 40); W.sun.target.position.set(p.x, 0, p.z);
  // zona atual
  const z = zoneAt(p.x, p.z);
  if (z !== W.zoneId) { W.zoneId = z; UI.zoneChanged(z); }
  // interação mais próxima
  let best = null, bd = 1e9;
  for (const it of W.interactables) {
    const dd = Math.hypot(p.x - it.x, p.z - it.z);
    if (dd < it.r && dd < bd) { bd = dd; best = it; }
  }
  W.near = UI.isOpen() ? null : best;
}
function animateWorld(dt, t) {
  W.spinners.forEach((s) => (s.o.rotation.y += s.s * dt));
  W.floaters.forEach((f) => (f.o.position.y = f.y + Math.sin(t * 2 + (f.ph || 0)) * f.a));
  for (const id in W.zoneBarriers) W.zoneBarriers[id].mat.opacity = 0.22 + Math.sin(t * 2.4) * 0.08;
  W.scene.traverse((o) => { if (o.userData && o.userData.sparkle) o.rotation.y += dt * 1.5; if (o.userData && o.userData.holo) o.userData.holo.emissive.setHSL((t * 0.15) % 1, 0.8, 0.5); });
}

function h(tag, attrs, kids) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "disabled") e.disabled = !!v;
    else e.setAttribute(k, v);
  }
  (Array.isArray(kids) ? kids : kids === undefined ? [] : [kids]).forEach((c) => {
    if (c === null || c === undefined || c === false) return;
    e.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  });
  return e;
}
function toast(msg, kind) {
  const box = document.getElementById("toast");
  const t = h("div", { class: "toast " + (kind || "") }, msg);
  box.appendChild(t);
  while (box.children.length > 4) box.removeChild(box.firstChild);
  setTimeout(() => t.remove(), 3200);
}
function handle(res, okMsg) {
  if (!res.ok) { toast(res.msg, "bad"); return false; }
  if (okMsg) toast(typeof okMsg === "function" ? okMsg(res) : okMsg, "good");
  UI.changed();
  return true;
}

function rewardLine(r) {

  },
  tabs(b, key, items, onPick) {

    const yes = h("button", { type: "button", class: "btn " + (opts.danger ? "r" : "g"), onclick: () => { if (opts.phrase && input.value.trim().toUpperCase() !== opts.phrase) { toast("Digite " + opts.phrase + " para confirmar.", "bad"); return; } layer.remove(); onYes(input ? input.value.trim().toUpperCase() : undefined); } }, yesLabel);
    layer.append(h("div", { class: "win", style: "width:min(440px,100%)" }, [
      h("div", { class: "win-h" }, [h("h2", null, title)]),

      ]),

  },
  zoneChanged(z) {
    const zn = ZONE[z];
    const ban = document.getElementById("zoneBanner");
    const owned = !!S.zones[z];
    ban.innerHTML = "";
    ban.append(zn.name.split(" — ")[0].toUpperCase(), zn.luck > 0 ? h("small", null, `+ ${Math.round(zn.luck * 100)}% Sorte${owned ? "" : " (bloqueada)"}`) : h("small", null, zn.name.split(" — ")[1] || ""));
    ban.style.color = rgb(zn.color);
    ban.style.opacity = 1;
    clearTimeout(UI.banT);
    UI.banT = setTimeout(() => (ban.style.opacity = 0), 2600);
    UI.hud();
  },
  disposeInspect() {
    if (UI.inspect) { UI.inspect.stop = true; try { UI.inspect.r.dispose(); UI.inspect.r.forceContextLoss(); } catch (e) {} UI.inspect = null; }
  },
  // visualizador 3D da skin: arrastar gira, roda aproxima
  mountInspect(canvas, it) {
    const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    r.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    const w = canvas.clientWidth || 400, hh = canvas.clientHeight || 220;
    r.setSize(w, hh, false);
    const sc = new THREE.Scene();
    sc.add(new THREE.HemisphereLight(0xffffff, 0x334477, 0.9));
    const dl = new THREE.DirectionalLight(0xffffff, 0.9); dl.position.set(3, 5, 6); sc.add(dl);
    const cam = new THREE.PerspectiveCamera(40, w / hh, 0.1, 100);
    const m = buildWeapon(SKIN[it.defId], it.up); sc.add(m);
    const st = { r, stop: false, rx: 0.2, ry: 0.6, dist: 9, auto: true };
    let drag = null;
    canvas.onpointerdown = (e) => { drag = { x: e.clientX, y: e.clientY }; st.auto = false; canvas.setPointerCapture(e.pointerId); };
    canvas.onpointermove = (e) => { if (!drag) return; st.ry += (e.clientX - drag.x) * 0.01; st.rx = Math.max(-1.2, Math.min(1.2, st.rx + (e.clientY - drag.y) * 0.01)); drag = { x: e.clientX, y: e.clientY }; };
    canvas.onpointerup = canvas.onpointercancel = () => (drag = null);
    canvas.onwheel = (e) => { st.dist = Math.max(4.5, Math.min(16, st.dist + e.deltaY * 0.01)); e.preventDefault(); };
    const loop = () => {
      if (st.stop) return;
      if (st.auto) st.ry += 0.008;
      m.rotation.set(st.rx, st.ry, 0);
      m.traverse((o) => { if (o.userData.holo) o.userData.holo.emissive.setHSL((performance.now() / 6000) % 1, 0.8, 0.5); });
      cam.position.set(0, 0.6, st.dist); cam.lookAt(0, 0.1, 0);
      r.render(sc, cam);
      requestAnimationFrame(loop);
    };
    loop();
    UI.inspect = st;
    return st;
  },
};

// ---------------------------------------------------------------- abertura com roleta
let spinning = false;
function doOpen(caseId, qty, useFree) {
  if (spinning) return;
  const res = openCases(caseId, qty, useFree, W.zoneId);
  if (!res.ok) { toast(res.msg, "bad"); if (UI.auto) stopAuto(); return; }
  W.dirty = true;
  UI.hud();
  playSpin(caseId, qty, res);
}
function playSpin(caseId, qty, res) {
  spinning = true;
  const sp = document.getElementById("spin");
  sp.innerHTML = ""; sp.hidden = false;
  const c = CASE[caseId];
  sp.append(h("div", { class: "chunk", style: "font-size:24px" }, `${c.name} ×${qty}${res.useFree ? " (grátis)" : ""}`));
  const animate = !S.settings.skip && qty <= ECO.Opening.MaxAnimatedStrips;
  const base = S.settings.fast ? ECO.Opening.FastSpinSeconds : qty > 1 ? ECO.Opening.MultiSpinSeconds : ECO.Opening.NormalSpinSeconds;
  const dur = base * speedFactor() * (UI.auto ? 0.6 : 1);
  const finish = () => showResults(caseId, qty, res);
  if (!animate) { sp.append(h("div", { class: "muted" }, "Sorteando…")); setTimeout(finish, 450); return; }
  const reels = h("div", { class: "reels" });
  sp.append(reels);
  const small = qty > 1;
  const cw = small ? 84 : innerWidth < 560 ? 104 : 140, gap = 6, WIN = 52;
  const strips = [];
  res.results.forEach((r) => {
    const reel = h("div", { class: "reel" + (small ? " sm" : "") }, [h("div", { class: "mark" })]);
    const strip = h("div", { class: "strip" });
    for (let i = 0; i < WIN + 6; i++) {
      const id = i === WIN ? r.defId : pickEntry(res.entries, Math.random()).skinId;
      strip.append(h("div", { class: "cell", style: `--rc:${rc(SKIN[id].rarity)}` }, iconCanvas(id, small ? 80 : 140, small ? 40 : 70)));
    }
    reel.append(strip); reels.append(reel); strips.push({ reel, strip });
  });
  sp.append(h("button", { type: "button", class: "btn s", onclick: () => { strips.forEach((s) => { s.strip.style.transition = "none"; }); clearTimeout(UI.spinT); finish(); } }, "Pular"));
  requestAnimationFrame(() => requestAnimationFrame(() => {
    strips.forEach(({ reel, strip }) => {
      const jitter = (Math.random() - 0.5) * cw * 0.7;
      const x = -(WIN * (cw + gap) + cw / 2 - reel.clientWidth / 2) + jitter;
      strip.style.transition = `transform ${dur}s cubic-bezier(.12,.72,.14,1)`;
      strip.style.transform = `translateX(${x}px)`;
    });
  }));
  UI.spinT = setTimeout(finish, dur * 1000 + 250);
}
function showResults(caseId, qty, res) {
  if (!spinning) return;
  const sp = document.getElementById("spin");
  sp.innerHTML = "";
  const its = res.results.map((r) => S.inv[r.uid]).filter(Boolean);
  const bestTier = Math.max.apply(null, res.results.map((r) => tierOf(SKIN[r.defId].rarity)));
  const total = its.reduce((a, i) => a + SKIN[i.defId].value, 0);
  const cost = res.cost;
  const bestR = RORDER[bestTier - 1];
  if (bestTier >= 4 && !S.settings.reduce) {
    sp.style.background = `radial-gradient(circle, color-mix(in srgb, ${rc(bestR)} 45%, transparent), rgba(5,9,26,.9) 70%)`;
  } else sp.style.background = "";
  sp.append(h("div", { class: "chunk burst", style: `font-size:${bestTier >= 5 ? 40 : 28}px;color:${rc(bestR)}` }, bestTier >= 6 ? "SECRETA!!!" : bestTier >= 5 ? "LENDÁRIA!" : bestTier >= 4 ? "ÉPICA!" : "Você ganhou"));
  sp.append(h("div", { class: "muted" }, `Valor obtido: ₵ ${fmt(total)} • gasto: ₵ ${fmt(cost)}`));
  const g = h("div", { class: "grid" });
  res.results.forEach((r) => { const it = S.inv[r.uid]; if (it) { const el = itemCard(it, { isNew: r.isNew }); if (tierOf(SKIN[it.defId].rarity) >= 4 && !S.settings.reduce) el.classList.add("hl", "burst"); g.append(el); } });
  sp.append(h("div", { id: "results" }, g));
  const cheap = its.filter((i) => tierOf(SKIN[i.defId].rarity) < ECO.ValuableConfirmTier && !i.fav);
  const cheapV = cheap.reduce((a, i) => a + SKIN[i.defId].value, 0);
  const done = () => { sp.hidden = true; sp.innerHTML = ""; sp.style.background = ""; spinning = false; UI.changed(); flushLevelUps(); };
  const c = CASE[caseId];
  const again = h("button", { type: "button", class: "btn g", onclick: () => { done(); doOpen(caseId, qty, (S.freeCases[caseId] || 0) >= qty); } }, `Abrir de novo ×${qty} • ₵ ${fmt(c.price * qty)}`);
  sp.append(h("div", { class: "row", style: "justify-content:center" }, [
    h("button", { type: "button", class: "btn", onclick: done }, "Guardar"),
    h("button", { type: "button", class: "btn y", disabled: !cheap.length, onclick: () => { handle(sellItems(cheap.map((i) => i.uid), false, false), (r) => `Vendidas ${r.sold} por ₵ ${fmt(r.credits)}.`); done(); } }, cheap.length === its.length ? `Vender tudo ₵ ${fmt(cheapV)}` : `Vender abaixo de Lendária ₵ ${fmt(cheapV)}`),
    again,
    UI.auto ? h("button", { type: "button", class: "btn r", onclick: () => { stopAuto("Abertura automática parada."); done(); } }, "PARAR AUTO") : null,
  ]));
  flushLevelUps();
  if (UI.auto) {
    UI.auto.count++;
    const a = UI.auto;
    const elapsed = now() - a.started;
    if (a.count >= ECO.Opening.AutoMaxOpensPerSession || elapsed >= ECO.Opening.AutoMaxSessionSeconds) { stopAuto(`Abertura automática pausada no limite (${a.count} caixas). Inicie de novo quando quiser.`); return; }
    if (bestTier >= 5) { stopAuto("Abertura automática parada: você tirou uma " + rarityName(bestR) + "!"); return; }
    UI.autoT = setTimeout(() => { if (!UI.auto) return; done(); doOpen(caseId, 1, (S.freeCases[caseId] || 0) >= 1); }, Math.max(ECO.Opening.AutoMinInterval, 1.1) * 1000);
  }
}
function startAuto(caseId) {
  UI.auto = { caseId, count: 0, started: now() };
  toast("Abertura automática ligada. Para sozinha em Lendária+, sem créditos ou no limite.", "good");
  doOpen(caseId, 1, (S.freeCases[caseId] || 0) >= 1);
}
function stopAuto(msg) {
  clearTimeout(UI.autoT);
  UI.auto = null;
  if (msg) toast(msg);
  if (UI.cur === "case") UI.render(true);
}
function flushLevelUps() {
  while (pendingLevelUps.length) {
    const l = pendingLevelUps.shift();
    toast(`⬆️ Nível ${l}!${PROG.levelRewards[String(l)] ? " Prêmio em Presentes." : ""}`, "good");
    W.dirty = true;
  }
}

// ============================================================================
// Inicialização e laço principal
// ============================================================================
function start() {
  S = loadProfile();
  refreshPeriods(now());
  settle(now()); // produção offline desde a última visita (limitada como no jogo)
  buildWorld();
  buildSide();
  setupControls();
  W.dirty = true;
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    try { window.claude.hot.snapshot(() => ({ S })); } catch (e) {}
  }
  let acc = 0, saveAcc = 0, lastT = 0;
  const loop = () => {
    const dt = Math.min(0.05, W.clock.getDelta());
    const t = W.clock.elapsedTime;
    stepPlayer(dt);
    animateWorld(dt, t);
    acc += dt; saveAcc += dt;
    if (acc >= 0.25) {
      acc = 0;
      if (t - lastT >= 1) { lastT = t; settle(now()); }
      if (W.dirty) {
        W.dirty = false;
        refreshCaseLabels(); refreshZones(); refreshShowroom(); refreshPlayerLook();
      }
      UI.hud();
    }
    if (saveAcc >= 4 || saveTimer) { if (saveAcc >= 1) { saveAcc = 0; saveTimer = 0; save(); } }
    W.renderer.render(W.scene, W.camera);
    requestAnimationFrame(loop);
  };
  loop();
  toast("Bem-vindo! Ande até uma caixa ou prédio e aperte E (ou o botão verde).", "good");
  window.addEventListener("beforeunload", save);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
}
if (typeof THREE === "undefined") {
  document.getElementById("game").innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif">Não foi possível carregar o motor 3D. Verifique a conexão e recarregue a página.</div>';
} else {
  // espera a fonte das placas (até 1,5 s) para os letreiros 3D saírem com a letra certa
  const boot = () => {
    let done = false;
    const go = () => { if (!done) { done = true; start(); } };
    setTimeout(go, 1500);
    if (document.fonts && document.fonts.load) document.fonts.load('40px "Lilita One"').then(go, go); else go();
  };
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot();
}

</script>
